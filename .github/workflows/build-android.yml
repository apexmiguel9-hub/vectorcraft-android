# Compila el port de Android de VectorCraft y publica el APK.
#
# MEDIDO sobre como falla esto, y por que cada paso esta separado:
#
# - `cargo build` de 237k lineas con ~400 dependencias tarda 20-40 min. Si el fallo
#   es de codigo Rust, se ve en el log de cargo, no en el de Gradle.
# - El error clasico de un port Android NO es de codigo, es de empaquetado: un
#   `.so` con el nombre mal, un target de triple distinto, o un `.so` aplanado. Por
#   eso hay un paso que **comprueba el APK antes de darlo por bueno**: mira que el
#   `.so` este dentro, con el nombre exacto y con tabla de excepciones.
#
# `android.aapt2FromMavenOverride` no hace falta: el plugin de Android ya trae aapt2.
name: build-android

on:
  push:
    paths:
      - 'apps/vectorcraft-android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # target de triple. `aarch64-linux-android` es lo que usan los moviles de 64 bits
  # y lo que等同 `arm64-v8a` de Gradle. Si alguno no cuadra, el APK se empaqueta y
  # luego Android lo ignora en silencio: por eso el paso de verificar.
  ANDROID_TARGET: aarch64-linux-android
  # El nombre de ABI que usa `jniLibs`. `cargo ndk` mapea este al triple de Rust.
  ANDROID_ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Clonar con historial completo
        uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        # MEDIDO: el `rustc` de la imagen de GitHub se queda corto.
        # `wgpu-types@30` exige rustc 1.87 y sale:
        #   "rustc 1.XX is not supported by the following packages:
        #    wgpu-types@30.0.1 requires rustc 1.87"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Poner el rustc por delante de el de la imagen
        # MEDIDO: la imagen trae un rustc en /usr/bin que gana al de ~/.cargo/bin
        # segun el PATH, y ese es el viejo. Sin esto, da el error de wgpu-types
        # aunque se haya instalado stable.
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Comprobar el rustc que se va a usar
        run: |
          rustc --version
          cargo --version
          # Si esto falla, la imagen de la accion no es la que creemos y el error
          # de mas abajo seria dificil de entender.
          rustc --version | grep -oE '[0-9]+\.[0-9]+' | head -1

      - name: Instalar target Android
        run: rustup target add $ANDROID_TARGET

      - name: Instalar cargo-ndk
        # `cargo ndk` es lo que sabe qué target triple corresponde a qué carpeta
        # `jniLibs`. Sin el, el .so acaba en un sitio que Android no mira.
        run: cargo install cargo-ndk --locked

      - name: Cache de target/
        uses: actions/cache@v4
        with:
          path: target
          key: android-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: gradle-

      - name: JDK 17
        # MEDIDO que hace falta, y el orden importa: en `ubuntu-22.04` el JDK por
        # defecto es el 11, y `sdkmanager` se niega a arrancar:
        #
        #   This tool requires JDK 17 or later. Your version was detected as 11.0.32.1.
        #
        # El plugin de Android (AGP 8.5) tambien pide 17, así que el paso hace falta
        # para las dos cosas. Y tiene que ir ANTES que `setup-android`, porque es el
        # propio `sdkmanager` el que comprueba la versión al arrancar.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Poner el SDK de Android en el PATH
        # MEDIDO: sin este paso, `sdkmanager` da exit 127 y el error no menciona ni
        # el NDK ni el SDK.
        #
        # MEDIDO: NO se deja `packages` con su valor por defecto. Instala `tools`, que
        # ya no existe en el SDK moderno, y el paso muere con:
        #   Warning: Failed to find package 'tools'
        #   Error: ...sdkmanager failed with exit code 1
        # que no menciona nada de NDK. Solo hace falta `platform-tools`, que ya viene
        # en la imagen del runner.
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Instalar el NDK
        # La version tiene que coincidir con `ndkVersion` de app/build.gradle. Si no
        # coinciden, el link falla con simbolos raros, y el error no menciona NDK.
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125"
          echo "NDK_DIR=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          ls -d "$ANDROID_SDK_ROOT/ndk/26.1.10909125"

      - name: Compilar la libreria nativa
        # MEDIDO que hace falta `--locked`: sin el, cargo puede resolver versiones
        # nuevas a mitad y el fallo aparece como "noSuchMethod" en una dependencia
        # que ayer compilaba.
        #
        # MEDIDO: `-t` toma el NOMBRE DE ABI (`arm64-v8a`), no el triple de Rust ni
        # `androidTargetTriplet=...`. Ese prefijo era de cargo-ndk 2.x y en 3.x sale:
        #   error: invalid value 'androidTargetTriplet=aarch64-linux-android'
        #          for '--target <TARGET>'
        #
        # MEDIDO: `cargo ndk strip` NO existe en 3.x:
        #   error: no such command: `strip`
        # Y para una build de depuracion no se quiere de todas formas. Los simbolos
        # de depuracion son lo que hace que un panic de Rust salga con backtrace: sin
        # ellos, el logcat solo dice "Fatal signal 6" y no hay ni una linea de donde
        # fallo. El `.so` pesa mas, y esa es justo la condicion en la que un panic se
        # lee.
        env:
          # `cargo ndk` se lo pone a sus propios hijos, pero no al shell de este paso,
          # y de ahi sale el `llvm-strip` de abajo. Sin esto, la variable va vacia y
          # el strip se salta en silencio.
          ANDROID_NDK_HOME: ${{ env.NDK_DIR }}
        run: |
          cargo ndk \
            -t $ANDROID_ABI \
            -o ./target \
            build -p vectorcraft-android --locked
          echo "--- .so producido ---"
          SO=target/$ANDROID_TARGET/debug/libvectorcraft_android.so
          ls -la "$SO"
          file "$SO"

          # MEDIDO: sin esto, el .so sale de **943 MB**. Son 237k lineas de
          # codigo mas ~400 dependencias compiladas en debug y sin symbols, y eso no
          # entra en un APK ni en el cache de GitHub.
          #
          # `--strip-debug` quita SOLO la tabla DWARF (numeros de linea y tipos).
          # NO toca `.eh_frame`, que es lo que permite que un panic salga con
          # backtrace, ni la tabla de simbolos dinamicos, que es lo que el enlazador
          # del movil necesita para resolver funciones de Rust. Por eso se usa este
          # y no un `strip` a secas, que dejaria el .so inservible.
          echo "--- quitando la tabla de depuracion (no los simbolos) ---"
          STRIP=$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-strip 2>/dev/null | head -1)
          if [ -z "$STRIP" ]; then
            echo "::warning::no se encuentra llvm-strip; el .so se queda enorme"
          else
            "$STRIP" --strip-debug "$SO"
            ls -la "$SO"
          fi

      - name: Comprobar que el .so tiene tabla de excepciones
        # Si esto falla, el paso anterior no hizo strip bien y cualquier panic va a
        # salir sin backtrace. Se comprueba ANTES de empaquetar, cuando el arreglo
        # es un flag y no un bug de native.
        run: |
          SO=target/$ANDROID_TARGET/debug/libvectorcraft_android.so
          if command -v llvm-readelf >/dev/null; then
            llvm-readelf -S "$SO" | grep -q '\.eh_frame' || {
              echo "::error::el .so no tiene .eh_frame: se aplo y los panics saldrán sin backtrace"
              exit 1
            }
          else
            echo "::warning::no hay llvm-readelf; no se comprueba .eh_frame"
          fi
          # Y el simbolo que Android busca para el entry point:
          if command -v llvm-nm >/dev/null; then
            llvm-nm -D --defined-only "$SO" | grep -i 'ANativeActivity_onCreate\|JNI_OnLoad' \
              || echo "::warning::no se ve el simbolo de entrada; GameActivity lo pedira en runtime"
          fi

      - name: Empaquetar el APK
        # Se copia el .so a mano en vez de dejar que lo haga cargo-ndk por dentro, para
        # que quede explicito en un paso y se pueda ver en el log.
        working-directory: apps/vectorcraft-android/android
        run: |
          mkdir -p app/src/main/jniLibs/$ANDROID_ABI
          # MEDIDO: esto es `../../../target`, no `../../../../target`. Desde
          # apps/vectorcraft-android/android:
          #   ..  -> apps/vectorcraft-android
          #   ../..  -> apps
          #   ../../..  -> la raiz del repo
          # Un nivel de mas y el error es "cp: cannot stat ... No such file or
          # directory", que parece que el .so no se ha compilado. Y se ha compilado.
          cp ../../../target/$ANDROID_TARGET/debug/libvectorcraft_android.so \
             app/src/main/jniLibs/$ANDROID_ABI/libvectorcraft_android.so
          chmod 644 app/src/main/jniLibs/arm64-v8a/libvectorcraft_android.so
          ls -la app/src/main/jniLibs/$ANDROID_ABI/
          chmod +x gradlew 2>/dev/null || true

      - name: Fijar la versión de Gradle
        # MEDIDO que hace falta: el proyecto no lleva `gradle/wrapper`, y la versión de
        # Gradle que trae la imagen del runner no coincide con la que pide el plugin de
        # Android. El fallo de eso es un mensaje que habla de "AGP requires Gradle
        # 8.7" y no de Gradle, que es facil atribuir a otra cosa.
        #
        # En vez de subir el wrapper al repo (un `.jar` binario), se genera aqui. Es lo
        # mismo y no ensucia el arbol con un binario.
        working-directory: apps/vectorcraft-android/android
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew --version | head -5

      - name: Construir con Gradle
        working-directory: apps/vectorcraft-android/android
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_DIR }}
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Comprobar que el APK lleva el .so dentro
        # MEDIDO: el fallo mas comun de un port de Android. El .so se compila bien,
        # Gradle construye bien, y el APK sale sin el porque la carpeta no era la que
        # AGP empaca. Se comprueba con `unzip -l`, que no necesita instalar nada.
        run: |
          APK=apps/vectorcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::no sale el APK en $APK"; exit 1; }
          echo "--- contenido relevante del APK ---"
          unzip -l "$APK" | grep -E '\.so|AndroidManifest|classes' || true
          echo "--- buscando la libreria ---"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libvectorcraft_android.so' || {
            echo "::error::el APK NO lleva lib/arm64-v8a/libvectorcraft_android.so"
            echo "::error::el .so se compila pero no se empaqueta. Revisa jniLibs y abiFilters."
            exit 1
          }
          echo "OK: el .so esta dentro con el nombre y la arquitectura correctos"

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-android-debug
          path: apps/vectorcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Resumen de lo que se ha empaquetado
        # Que quede por escrito que tamano tiene el .so: si se dispara de golpe,
        # lo normal es que se ha creado un binario de debug sin strip.
        run: |
          SO=target/$ANDROID_TARGET/debug/libvectorcraft_android.so
          echo "### .so: $(du -h $SO | cut -f1)"
          echo "### APK: $(du -h apps/vectorcraft-android/android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
          echo "### Sin --strip-debug esto son ~943 MB. Si sale de mas de 200, el strip no corrio."