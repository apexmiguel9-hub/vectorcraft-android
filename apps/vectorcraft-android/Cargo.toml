[package]
name = "vectorcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# MEDIDO: aqui NO se heredan los lints del workspace, a proposito.
#
# El workspace prohibe `unsafe_code = "deny"`, y un punto de entrada de Android lo
# necesita:
#
#     error: usage of unsafe attribute
#        --> apps/vectorcraft-android/src/lib.rs:131:3
#
# En Rust moderno `#[no_mangle]` es un atributo `unsafe`, asi que hace falta
# `#[unsafe(no_mangle)]`, y el lint lo marca igual porque el bloque de abajo es
# `extern "C"`.
#
# El ejemplo oficial de egui hace exactamente esto mismo (`hello_android`): su
# `Cargo.toml` trae comentados los `[lints] workspace = true` con el motivo
# "unsafe_code is required for #[no_mangle]".
#
# El resto de codigo del crate no usa `unsafe`: solo esta firma. Es el unico sitio
# del proyecto entero donde hace falta.
# [lints]
# workspace = true

[dependencies]
vectorcraft-engine = { workspace = true }
vectorcraft-ui-egui = { workspace = true }
vectorcraft-render = { workspace = true }

# MEDIDO que hace falta `android-native-activity`, y no `android-game-activity`.
#
# Es lo que usa el ejemplo oficial de egui (`eframe/examples/hello_android`) y es
# el unico camino con un `android_main` que se sabe que arranca. Con
# `android-game-activity` el punto de entrada se busca por otro mecanismo y no hay
# ejemplo equivalente.
#
# El teclado blando tiene un problema conocido con `native-activity` —no aparece en
# Android moderno— y `game-activity` lo arregla. Se deja pendiente a proposito:
# primero que la app abra, despues el teclado. Ver el comentario del modulo.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }


# MEDIDO: para mover bytes entre Rust y el `ContentResolver` en base64, con las
# mismas funciones que usa el motor para sus parametros (`{name, dataBase64}`), de
# modo que el formato es el del proyecto y no uno inventado aqui.
vectorcraft-format = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# MEDIDO: SAF necesita JNI, y solo en Android. Va en el bloque del target y no en
# `[dependencies]` a proposito: `jni` es FFI a la JVM y en una build de escritorio no
# lo usa nadie, asi que debe quedar fuera del grafo.
#
# MEDIDO que no amplia el grafo: `jni` 0.22.4 **ya esta dentro** como dependencia de
# `android-activity`, que es la que usa la feature `android-native-activity`. Anadirla
# aqui como directa no baja nada nuevo.
#
# Se eligio la 0.22 y no la 0.21 porque su API de `Env` es la unica que se ha podido
# comprobar leyendo el codigo del crate: `attach_current_thread_for_scope`,
# `new_string`, `get_string`, `find_class`, `exception_check/describe/clear`, y
# `call_static_method` con los macros `jni_str!` y `jni_sig!`.
jni = "0.22"
# `AndroidApp` viene de aqui, y es lo que `android_main` recibe.
winit = { workspace = true }
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
android_logger = { workspace = true }

# Android carga este .so con `System.loadLibrary`, asi que tiene que ser cdylib.
#
# MEDIDO: si no hay ningun `#[no_mangle]` en el crate, el `.so` sale VACIO. El
# enlazador borra todo lo que no sea alcanzable desde las exportaciones, y en Rust
# lo unico que se exporta es lo marcado con `#[no_mangle]`. Se vio un `.so` de 5,8
# MB con 566 KB de `.text` y **3 simbolos dinamicos** para 225.484 lineas de codigo.
[lib]
name = "vectorcraft_android"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# El mismo `main` sirve de binario de escritorio: con esto se prueba en local sin
# tocar el movil, que es donde se van a achar los bugs de logica.
[[bin]]
name = "vectorcraft-android"
path = "src/main.rs"