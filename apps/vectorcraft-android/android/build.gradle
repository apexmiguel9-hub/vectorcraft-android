// Raiz del proyecto Android de VectorCraft.
//
// NOTA sobre NDK y arquitectura: solo se compila `arm64-v8a`. Es lo que tiene el
// movil de pruebas, y el motor es `vello_cpu` (CPU pura), asi que el unico trabajo
// real de la GPU es presentar pixeles por egui-wgpu. Anadir mas arquitecturas es
// question de `abiFilters`, no de codigo.
//
// `android.ndkVersion` se fija para que CI y local usen la misma. Sin esto,
// `cargo ndk` y Gradle pueden acabar usando NDKs distintas y el link falla con un
// error que no menciona el NDK.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

// MEDIDO: aqui NO va un bloque `allprojects { repositories { ... } }`.
//
// `settings.gradle` declara:
//
//     repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
//
// que dice "los repositorios se declaran aqui y en ningun otro sitio". Si tambien
// se declaran en un `build.gradle`, Gradle aborta al evaluar el proyecto:
//
//     Build was configured to prefer settings repositories over project
//     repositories but repository 'Google' was added by build file 'build.gradle'
//
// El error aparece en el paso que genera el wrapper, no en el de construir, porque
// `gradle wrapper` tambien evalua el build. Asi que el sintoma apunta al paso
// equivocado otra vez.
//
// Los repositorios estan todos en `settings.gradle`: google() y mavenCentral().

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}