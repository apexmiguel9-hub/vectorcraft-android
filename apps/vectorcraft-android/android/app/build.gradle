apply plugin: 'com.android.application'

android {
    namespace 'ai.storyteller.vectorcraft'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'ai.storyteller.vectorcraft'
        minSdk 24
        targetSdk 34
        versionCode 1
        // MEDIDO: upstream subio el workspace a 0.4.0 al fusionar sus 188 commits, y aqui
        // la version estaba a mano. El `Cargo.toml` del port si la hereda
        // (`version.workspace = true`) y el log la imprime
        // (`vectorcraft-android: arrancando, version …`), asi que si aqui se queda
        // desfasada el Ajustes → Acerca de y el log dicen cosas distintas.
        versionName '0.4.0'

        // MEDIDO: solo arm64-v8a. El motor es vello_cpu (CPU), y lo unico que hace
        // la GPU es presentar pixeles via egui-wgpu. Una arquitectura mas es una
        // linea en abiFilters, no codigo.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // MEDIDO: `useLegacyPackaging false` es lo que hace que Android descomprima la
    // libreria al instalarla en vez de leerla del APK. Sin eso funciona igual, pero
    // la libreria se queda sin comprimir en el disco y pesa mas.
    packaging {
        jniLibs {
            useLegacyPackaging false

            // MEDIDO que hace falta, y es la razon de que se llegue a tener que
            // mirar el ensamblador a mano.
            //
            // AGP **vuelve a est ripear las librerias nativas al empaquetarlas**,
            // y lo hace con `strip` a secas, que ademas de quitar `.debug_*` quita
            // `.symtab` y `.strtab`. Medido comparando tamanos: el paso de
            // `build-android-so` deja la `.so` en 79 MB, y la que va dentro del APK
            // pesa 55,8 MB.
            //
            // Con `.symtab` fuera, el tombstone solo nombra los simbolos que estan en
            // `.dynsym`, y de un `cdylib` de Rust eso son **dos**: `android_main` y
            // `ANativeActivity_onCreate`. El resto del backtrace son direcciones
            // crudas:
            //
            //     #07 pc 0000000001542480   base.apk (offset 0xb0000)
            //
            // Se puede saber que se ha panicado y nada mas. Sin esto, el unico modo
            // de averiguar donde falla es desensamblar a mano, que es como se
            // averiguo que el crash estaba en `eframe::run_native`.
            //
            // Esto es un build `debug`, asi que los simbolos se quedan. En un
            // `release` habria que quitarlo.
            //
            // MEDIDO: es `+=` y no una llamada. Con `keepDebugSymbols '**/*.so'`:
            //
            //     Could not find method keepDebugSymbols() for arguments [**/*.so]
            //     on object of type ...JniLibsPackagingImpl$AgpDecorated
            //
            // Es un `MutableSet`, no un metodo. El error lo dice casi todo:
            // "method ... for arguments", cuando lo que hay delante es una
            // propiedad. El sintoma parece de API inexistente y la API esta.
            keepDebugSymbols += ['**/*.so']
        }
    }

    // MEDIDO que hizo falta quitar: habia un bloque
    //
    //     packagingOptions { jniLibs { excludes += ['**/*.so', '!**/lib...so'] } }
    //
    // que **excluia la libreria del APK**. Gradle construia sin quejarse y el APK
    // salia de 720 KB sin ninguna `.so` dentro. El sintoma es el peor posible:
    //
    //     el APK NO lleva lib/arm64-v8a/libvectorcraft_android.so
    //
    // cuando todo lo demas ha ido bien — la `.so` compila, pasa las comprobaciones
    // de `.eh_frame` y de `.text`, y se copia a `jniLibs`. Todo correcto hasta el
    // ultimo paso, y el fallo es una linea de configuracion que no habia motivo para
    // existir. La negacion `!**/...` tampoco funciona como se cree en este sitio.

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // El .so de debug lleva los simbolos, y eso ya es lo que hace que un
            // panic de Rust salga con backtrace.
            //
            // MEDIDO: aqui habia tambien `debugSymbolLevel 'FULL'` y AGP 8.5 no lo
            // tiene:
            //   Could not find method debugSymbolLevel() for arguments [FULL]
            // Ese es el DSL de AGP 8.9+. Los simbolos nativos los decide el
            // compilador de Rust (`--strip-debug` o no), no Gradle.
            jniDebuggable true
        }
    }
    }

dependencies {
    // MEDIDO: aqui NO va ninguna dependencia de `android-activity`, y esa es la
    // leccion de este fichero.
    //
    // Estaba puesto `implementation 'org.mozilla:android-activity:0.6.1'` y Gradle
    // contesta:
    //
    //     Could not resolve all files for configuration ':app:debugRuntimeClasspath'
    //       > Could not find org.mozilla:android-activity:0.6.1
    //
    // Ese artefacto **no existe en ningun repositorio de Maven**. Comprobado en
    // search.maven.org, en repo1.maven.org y en el maven de Google: 404 en los tres.
    // Pense que era la pieza Java del crate de Rust, y no lo es.
    //
    // La documentacion de `android-activity` lo dice sin rodeos:
    //
    //     NativeActivity
    //     Setup: Just add the feature flag
    //     "The unique advantage of the NativeActivity class is that it's shipped
    //      as part of the Android OS and so you can use it without needing to
    //      compile or link any Java or Kotlin code."
    //
    // Es decir: con `native-activity` **no hay ninguna dependencia**. `MainActivity`
    // hereda de `android.app.NativeActivity`, que ya esta en el sistema operativo, y
    // el punto de entrada `android_main` lo busca winit a traves del `.so`.
    //
    // NO anadir `androidx.games:games-activity` todavia. Es lo que arregla el teclado
    // (trae `GameTextInput`), pero anade una dependencia que hay que resolver y una
    // clase Java que compilar. Primero que abra.
    //
    // Cuando se quiera el teclado, la documentacion da la version exacta:
    //
    //     Add gradle dependency: androidx.games:games-activity:4.4.0
    //     + la feature `game-activity` en el Cargo.toml
    //     + MainActivity pasa a heredar de GameActivity
    //
    implementation 'androidx.annotation:annotation:1.7.1'
}

// ---------------------------------------------------------------------------
// El .so lo compila cargo, no Gradle.
//
// MEDIDO que hace falta: Gradle NO debe tocar esto. El reason es que los `.so` de
// debug se modulizan en el directorio de target de cargo, y copiar un `.so` a
// `jniLibs` lo aplana. Un `.so` aplanado **no tiene tabla de excepciones**, asi que
// un panic de Rust aborta sin backtrace y sin nada util en el logcat.
//
// Lo que hace este target es: compilar con cargo -> `cargo ndk strip` (que quita
// los simbolos de depuracion del `.so` de distribucion sin aplanarlo) -> copiar a
// `jniLibs`.
//
// Se ejecuta ANTES que cualquier tarea de Android, y Android depende de el.
// ---------------------------------------------------------------------------
// Aqui NO se compila Rust.
//
// MEDIDO que hizo falta quitarlo. El `.so` lo compila `build-android-so.yml` y lo
// coloca en `jniLibs` antes de que arranque Gradle. Que Gradle tambien compilara
// rompia por dos sitios:
//
//   1. `cargo ndk` dentro de Gradle necesita el NDK y `cargo ndk` en el PATH, y
//      el fallo sale como `Could not create task ':app:cargoBuild'`, que no dice
//      nada de la compilacion.
//   2. La copia de la `.so` usaba una variable (`ndkAbis`) definida dentro del
//      closure de otro task, y Gradle no la ve:
//
//      Could not get unknown property 'ndkAbis' for task ':app:cargoJniLibs'
//
// Ademas son 15 minutos de compilacion por cada `assembleDebug`, que es lo que se
// quiere evitar al partir el CI en dos.
//
// Para recompilar la libreria en local, a mano desde la raiz del repo:
//
//   cargo ndk -t arm64-v8a -o ./target strip \
//       build -p vectorcraft-android --locked
//   cp target/aarch64-linux-android/debug/libvectorcraft_android.so \
//      apps/vectorcraft-android/android/app/src/main/jniLibs/arm64-v8a/
//
// Y despues `./gradlew assembleDebug`. Es el mismo camino que sigue el CI, que es
// la unica forma de no tener dos versiones de la verdad.
//
// Este fichero solo empaqueta lo que encuentra en `jniLibs`. Si no esta, el APK
// sale sin libreria, y el paso de CI que comprueba el APK lo dice.

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
}
